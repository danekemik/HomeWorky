name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: homework-bot-deploy

    steps:
      - uses: actions/checkout@v4

      - name: Настроить SSH-ключ
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 176.123.168.87 >> ~/.ssh/known_hosts

      - name: Синхронизировать код на сервер
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude '.env' \
            --exclude 'backups' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '*.db' \
            --exclude '*.log' \
            --exclude 'tests' \
            --exclude '.pytest_cache' \
            --exclude '.mypy_cache' \
            --exclude '.ruff_cache' \
            --exclude '*.md' \
            ./ root@176.123.168.87:/opt/homework-bot/

      - name: Пересобрать и перезапустить контейнеры
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes root@176.123.168.87 \
            'docker compose -f /opt/homework-bot/docker-compose.yml -f /opt/homework-bot/docker-compose.prod.yml --project-directory /opt/homework-bot up -d --build'

      - name: Проверить состояние контейнеров
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes root@176.123.168.87 \
            'docker compose -f /opt/homework-bot/docker-compose.yml -f /opt/homework-bot/docker-compose.prod.yml --project-directory /opt/homework-bot ps'